[paths]
structures = "../generate_particles/out/particles.traj"
experimental_data = "../../data/experimental_scattering.h5"
relax_dir = "relax"
iq_dir = "iq"
fits_dir = "fits"
model = "../../model/mace_stagetwo.model"

[scattering]
qmin = 0.1810548
qmax = 17.1540611
qstep = 0.0074508362
qdamp = 0.023
rmin = 0.0
rmax = 60.000001
rstep = 0.01
biso = 0.0
batch_size = 16_777_216  # 4096*4096

[reference]
